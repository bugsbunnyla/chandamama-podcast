name: Generate Story Audio

on:
  push:
    branches: [main]
    paths:
      - 'stories/**'
      - '.github/scripts/generate-audio.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gTTS
        run: pip install gTTS

      - name: Generate Audio
        run: python .github/scripts/generate-audio.py

      - name: Commit Audio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add audio/
          git diff --cached --quiet || git commit -m "Auto-generate audio [bot]"
          git push
